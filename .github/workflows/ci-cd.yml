
name: TaskMate CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskmate:latest
            ghcr.io/${{ github.repository_owner }}/taskmate:${{ github.sha }}


      - name: Update Kubernetes Deployment
        run: |
          sed -i "s|image: .*|image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/taskmate:${GITHUB_SHA}|" deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml
          git commit -m "Update TaskMate image"
          git push
