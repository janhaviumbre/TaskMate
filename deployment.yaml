
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskmate-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: taskmate

  template:
    metadata:
      labels:
        app: taskmate

    spec:
      containers:
        - name: taskmate
          image: ghcr.io/janhaviumbre/TaskMate:df0056a3abc800aa8d24659b79b429f7d271dee8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
