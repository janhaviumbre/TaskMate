
apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskmate-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: taskmate

  template:
    metadata:
      labels:
        app: taskmate

    spec:
      containers:
        - name: taskmate
          image: ghcr.io/janhaviumbre/taskmate:d932959d99b0098f9f42c1b1a4afc3b353630cc6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
